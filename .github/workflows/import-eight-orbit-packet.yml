name: Import eight-orbit research packet

on:
  push:
    branches: [research/c3-eight-orbit-exact-2026-09-06]

permissions:
  contents: write

jobs:
  import:
    if: startsWith(github.event.head_commit.message, '[import-eight-packet]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/c3-eight-orbit-exact-2026-09-06
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Decode and validate the exact previously prepared patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          from pathlib import Path
          import subprocess
          import tempfile

          transport = Path('.github/eight-orbit-import')
          parts = [transport / f'part{i:02d}.txt' for i in range(10)]
          encoded = ''.join(p.read_text().strip() for p in parts)
          data = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = '69e39b7a93edfab7463f1eaeb55416a37e87861760c2b6773ff84bfaf6d774b5'
          assert hashlib.sha256(data).hexdigest() == expected, 'patch digest mismatch'
          root = Path('incoming/c3-own-side-eight-orbits-2026-09-05')
          assert not root.exists(), 'refusing to replace an existing packet'
          with tempfile.NamedTemporaryFile(suffix='.patch') as patch:
              patch.write(data)
              patch.flush()
              subprocess.run(['git', 'apply', '--check', patch.name], check=True)
              subprocess.run(['git', 'apply', patch.name], check=True)
          manifest = json.loads((root / 'manifest.json').read_text())
          for name, entry in manifest['files'].items():
              assert '/' not in name and '\\' not in name, 'unexpected manifest path'
              content = (root / name).read_bytes()
              assert len(content) == entry['bytes'], name
              assert hashlib.sha256(content).hexdigest() == entry['sha256'], name
          assert len(list(root.iterdir())) == 16, 'unexpected packet files'
          print('Exact patch and all 16 packet files verified.')
          PY
      - name: Fresh exact certificate, control, inventory, and unit checks
        working-directory: incoming/c3-own-side-eight-orbits-2026-09-05
        run: |
          python c3_eight_check.py --check
          python c3_eight_controls.py
          python build_report.py --check
          python -m unittest -v test_c3_eight.py
      - name: Commit only the packet and remove temporary transport
        shell: bash
        run: |
          git rm -r -- .github/eight-orbit-import .github/workflows/import-eight-orbit-packet.yml
          git add -- incoming/c3-own-side-eight-orbits-2026-09-05
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Research: import exact own-side C3 eight-orbit packet; remove transport'
          git push origin HEAD:refs/heads/research/c3-eight-orbit-exact-2026-09-06

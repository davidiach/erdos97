name: Verify and import unbounded-family artifacts
on:
  push:
    branches: [research/unbounded-six-exception-family-2026-09-06]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Regenerate and verify original packet bytes
        working-directory: incoming/unbounded-six-exception-family-2026-09-06
        run: |
          set -euo pipefail
          python algebra.py > algebra_checks.json
          python verify.py --chain-orbits 5 --bits 2048 --output finite_18_2048.json
          python verify.py --chain-orbits 9 --bits 8192 --output finite_30_8192.json
          python verify.py --chain-orbits 11 --bits 16384 --output finite_36_16384.json
          python -m unittest -v test_family.py
          python -m py_compile algebra.py intervals.py verify.py test_family.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for name, meta in json.loads(Path('manifest.json').read_text()).items():
              data = Path(name).read_bytes()
              assert len(data) == meta['bytes'], name
              assert hashlib.sha256(data).hexdigest() == meta['sha256'], name
          print('All 11 manifest entries match original bytes; 28 focused tests passed.')
          PY
      - name: Upload verified generated Git blobs without changing any ref
        working-directory: incoming/unbounded-six-exception-family-2026-09-06
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          expected = {
              'algebra_checks.json': '3e00aea3e0e59e07e0efcef926e183b0d99ef7bc',
              'finite_18_2048.json': '347a0c10d2eb66dccd020494560de958e7cae6c1',
              'finite_30_8192.json': '66667ab19af795c58f39eeb498a5f562b92a5311',
              'finite_36_16384.json': 'b3dcff5bbab611142ce6ce14c51d9da945a5b504',
          }
          for name, sha in expected.items():
              data = Path(name).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              payload = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/davidiach/erdos97/git/blobs',
                  data=payload, method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == sha, name
              print(name, sha)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('All four generated artifacts reproduce the original bytes. All 28 focused tests pass. No branch reference was changed.\n')
          PY

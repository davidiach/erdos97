name: artifact audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artifact-audit.yml'
      - 'Makefile'
      - 'README.md'
      - 'RESULTS.md'
      - 'STATE.md'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'requirements-lock.txt'
      - 'certificates/**'
      - 'cpp/**'
      - 'data/**'
      - 'docs/**'
      - 'lean/**'
      - 'metadata/**'
      - 'papers/**'
      - 'reports/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: artifact-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.scope.outputs.artifact }}
      compatibility: ${{ steps.scope.outputs.compatibility }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_scope.py

  artifact-pytest:
    needs: scope
    if: needs.scope.outputs.artifact == 'true'
    name: artifact pytest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Run PR artifact pytest shard
        if: github.event_name == 'pull_request'
        run: >-
          python -m pytest -q -m "artifact and not exhaustive"
          -n auto --dist worksteal
          --durations 20 --durations-min 1.0
          --shard-count 8 --shard-index ${{ matrix.shard }}
          --shard-namespace artifact-pr-balanced-v1-1118
      - name: Run full artifact pytest shard
        if: github.event_name != 'pull_request'
        run: >-
          python -m pytest -q -m "artifact"
          --shard-count 8 --shard-index ${{ matrix.shard }}
      - name: Run non-artifact slow/exhaustive pytest shard
        if: github.event_name != 'pull_request'
        run: >-
          python -m pytest -q -m "(slow or exhaustive) and not artifact"
          --shard-count 8 --shard-index ${{ matrix.shard }}

  artifact-audit:
    if: github.event_name != 'pull_request'
    name: artifact command audit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Run artifact audit
        run: >-
          python scripts/run_artifact_audit.py
          --shard-count 8 --shard-index ${{ matrix.shard }}
          --output-dir artifact-audit-results
      - name: Upload artifact audit summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifact-audit-${{ github.sha }}-shard-${{ matrix.shard }}
          path: artifact-audit-results/

  artifact-gate:
    name: artifact checks
    if: always()
    needs: [scope, artifact-pytest]
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.artifact }}
          RESULT: ${{ needs.artifact-pytest.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$RESULT" = success
          else
            test "$RESULT" = skipped
          fi

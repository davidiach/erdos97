name: external n9 and D2 audit

on:
  pull_request:
    paths:
      - '.github/workflows/external-n9-d2-audit.yml'
      - 'incoming/external-n9-d2-audit-2026-09-10/**'
      - 'src/erdos97/external_lean_audit.py'
      - 'src/erdos97/json_io.py'
      - 'scripts/audit_external_n9_d2.py'
      - 'tests/test_external_lean_audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-n9-d2-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    # Two builds (60 min each), two consumers (5 min each), and setup/upload.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate the audit manifest and record provenance
        id: manifest
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from erdos97.external_lean_audit import read_manifest
          path = Path('incoming/external-n9-d2-audit-2026-09-10/manifest.json')
          manifest = read_manifest(path)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('repository=' + manifest['upstream']['repository'] + '\n')
              output.write('commit=' + manifest['upstream']['commit'] + '\n')
          evidence = Path(os.environ['RUNNER_TEMP']) / 'external-n9-d2-evidence'
          evidence.mkdir()
          provenance = {
              'status': 'BOOTSTRAP_ONLY_NOT_VERIFIED',
              'local_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'upstream': manifest['upstream'],
              'manifest_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'accepted_claims_changed': False,
          }
          (evidence / 'bootstrap.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.manifest.outputs.repository }}
          ref: ${{ steps.manifest.outputs.commit }}
          path: upstream
          persist-credentials: false
      - name: Install the pinned toolchain without proof-output caching
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream/lean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Materialize locked dependencies and their cache
        working-directory: upstream/lean
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee "$RUNNER_TEMP/external-n9-d2-evidence/dependency-setup.log"
      - name: Fresh module builds, statement consumers, and strict axiom audit
        env:
          PYTHONPATH: src
        run: |
          python scripts/audit_external_n9_d2.py \
            --checkout "$GITHUB_WORKSPACE/upstream" \
            --packet incoming/external-n9-d2-audit-2026-09-10 \
            --timeout 3600 \
            --output "$RUNNER_TEMP/external-n9-d2-evidence/audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-n9-d2-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/external-n9-d2-evidence/
          retention-days: 14
          if-no-files-found: error

name: import-six-arc-product-research
on:
  push:
    branches:
      - research/six-arc-product-obstructions-2026-09-08
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'davidiach/erdos97' && github.ref == 'refs/heads/research/six-arc-product-obstructions-2026-09-08'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Decode and verify publication bundle
        run: python .publication-six-arc-20260908/import.py extract
      - name: Install scoped pinned verification dependencies
        run: python -m pip install sympy==1.14.0 pytest==9.0.3 ruff==0.15.11
      - name: Verify and publish only the feature branch
        run: python .publication-six-arc-20260908/import.py publish

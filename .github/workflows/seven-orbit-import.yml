name: Stage exact seven-orbit research packet

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  restore-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/c3-transitive-seven-orbits-2026-09-05'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Restore exact source files, regenerate and replay proof
        run: python .research-import/restore.py
      - name: Upload verified blobs and addition-only tree (no ref writes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .research-import/publish.py

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest-shard:
    name: pytest shard ${{ matrix.shard }} (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      # Full history so the release-packet provenance tests can resolve the
      # recorded source commit and take their strict verification path.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Run lint
        if: matrix.shard == 0
        run: make verify-lint
      - name: Run fast pytest shard
        run: >-
          python -m pytest -q
          --durations 20 --durations-min 1.0
          --shard-count 2 --shard-index ${{ matrix.shard }}
        env:
          PYTEST_ADDOPTS: -n auto --dist worksteal

  pytest:
    if: always()
    name: pytest (3.12)
    needs: pytest-shard
    runs-on: ubuntu-latest
    steps:
      - name: Check fast tier results
        env:
          PYTEST_RESULT: ${{ needs.pytest-shard.result }}
        run: |
          test "$PYTEST_RESULT" = success

  compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: compatibility pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install compatibility dependencies
        run: |
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            # python-flint 0.8 requires Python 3.11. Install the declared
            # dependency set without that optional exact backend; its tests
            # use pytest.importorskip when the module is unavailable.
            python -m pip install --no-deps -e .
            python -m pip install \
              'numpy>=1.24' \
              'scipy>=1.10' \
              'PyYAML>=6' \
              'mpmath>=1.3,<1.4' \
              'pytest>=7' \
              'pytest-xdist>=3.5' \
              'reportlab>=4.4' \
              'ruff>=0.15' \
              'sympy>=1.12' \
              'z3-solver>=4.12'
          else
            python -m pip install -e '.[dev]'
          fi
      # Lint and reproducibility tooling use the pinned 3.12 snapshot above.
      # These lanes exercise runtime compatibility without treating a floating
      # Ruff version as the repository's lint authority.
      - name: Run compatibility tests
        run: python -m pytest -q
        env:
          PYTEST_ADDOPTS: -n auto --dist worksteal

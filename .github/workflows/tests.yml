name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.scope.outputs.artifact }}
      compatibility: ${{ steps.scope.outputs.compatibility }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_scope.py

  pytest-shard:
    name: pytest shard ${{ matrix.shard }} (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      # Full history so the release-packet provenance tests can resolve the
      # recorded source commit and take their strict verification path.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Run lint
        if: matrix.shard == 0
        run: make verify-lint
      - name: Run fast pytest shard
        run: >-
          python -m pytest -q
          --durations 20 --durations-min 1.0
          --shard-count 2 --shard-index ${{ matrix.shard }}
        env:
          PYTEST_ADDOPTS: -n auto --dist worksteal

  pytest:
    if: always()
    name: pytest (3.12)
    needs: pytest-shard
    runs-on: ubuntu-latest
    steps:
      - name: Check fast tier results
        env:
          PYTEST_RESULT: ${{ needs.pytest-shard.result }}
        run: |
          test "$PYTEST_RESULT" = success

  compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: compatibility pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install compatibility dependencies
        run: |
          python -m pip install -e '.[dev]'
      # Lint and reproducibility tooling use the pinned 3.12 snapshot above.
      # These lanes exercise runtime compatibility without treating a floating
      # Ruff version as the repository's lint authority.
      - name: Run compatibility tests
        run: python -m pytest -q
        env:
          PYTEST_ADDOPTS: -n auto --dist worksteal

  compatibility-collect:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.compatibility == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --collect-only -q

  compatibility-gate:
    name: compatibility collection
    if: always()
    needs: [scope, compatibility-collect]
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          REQUIRED: ${{ github.event_name == 'pull_request' && needs.scope.outputs.compatibility == 'true' }}
          RESULT: ${{ needs.compatibility-collect.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$RESULT" = success
          else
            test "$RESULT" = skipped
          fi
